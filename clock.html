<script>
function lin(c) {
return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}
function chan(h, n) {
var k = (n + h / 60) % 6;
return 1 - Math.max(0, Math.min(k, 4 - k, 1));
}
function pure(h) {
return [chan(h, 5), chan(h, 3), chan(h, 1)];
}
function okHue(c) {
var r, g, b, l, m, s, A, B;
r = lin(c[0]);
g = lin(c[1]);
b = lin(c[2]);
l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
A = 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s;
B = 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s;
return (Math.atan2(B, A) * 180 / Math.PI + 360) % 360;
}
var H0 = okHue(pure(0));
function wheel(h) {
return (okHue(pure(h)) - H0 + 360) % 360;
}
function unwheel(u) {
var lo = 0;
var hi = 360;
for (var i = 0; i < 26; i++) {
var mid = (lo + hi) / 2;
if (wheel(mid) < u) lo = mid;
else hi = mid;
}
return lo;
}
function css(c, w) {
var f = function (v) {
return Math.round((v + (1 - v) * w) * 255);
};
return 'rgb(' + f(c[0]) + ', ' + f(c[1]) + ', ' + f(c[2]) + ')';
}
function pick(prev) {
var c = null;
for (var tries = 0; tries < 8; tries++) {
c = {
u: wheel(Math.random() * 360),
w: 0.55 * Math.pow(Math.random(), 2)
};
if (!prev) break;
if (Math.abs((c.u - prev.u + 540) % 360 - 180) > 40) break;
}
return c;
}
var BLANK = { u: 0, w: 1 };
var P = [];
P[0] = pick();
P[1] = pick(P[0]);
P[2] = pick(P[1]);
P[3] = pick(P[2]);
P[4] = pick(P[3]);
P[5] = pick(P[4]);
P[6] = pick(P[5]);
P[7] = pick(P[6]);
P[8] = pick(P[7]);
P[9] = pick(P[8]);
P[10] = pick(P[9]);
P[11] = pick(P[10]);
function ink(deg) {
var x = ((deg % 360) + 360) % 360 / 30;
var i = Math.floor(x);
var t = x - i;
var a = P[i % 12] || BLANK;
var b = P[(i + 1) % 12] || BLANK;
var d = (b.u - a.u + 540) % 360 - 180;
var u = (a.u + d * t + 360) % 360;
var w = a.w + (b.w - a.w) * t;
return css(pure(unwheel(u)), w);
}
</script>

<script>
var tint = document.querySelector('meta[name="theme-color"]');
function hand(id, deg) {
var el = document.getElementById(id);
if (!el) return;
el.style.rotate = deg + 'deg';
if (window.ink) el.style.color = ink(deg);
}
function frame() {
requestAnimationFrame(frame);
var now = new Date();
var s = now.getSeconds() + now.getMilliseconds() / 1000;
var m = now.getMinutes() + s / 60;
var h = now.getHours() % 12 + m / 60;
if (window.ink) document.documentElement.style.setProperty('--s', ink(s * 6));
hand('M', m * 6);
hand('H', h * 30);
hand('S', s * 6);
if (tint) tint.content = getComputedStyle(document.documentElement).backgroundColor;
}
requestAnimationFrame(frame);
</script>
